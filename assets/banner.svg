<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#12161F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFE082"/>
      <stop offset="1" stop-color="#F5B301"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="1280" height="380" rx="20" fill="url(#bg)"/>
  <!-- rejilla sutil -->
  <g stroke="#1E2634" stroke-width="1" opacity="0.5">
    <line x1="0" y1="95" x2="1280" y2="95"/><line x1="0" y1="285" x2="1280" y2="285"/>
  </g>

  <!-- wordmark -->
  <text x="640" y="150" text-anchor="middle" font-size="118" font-weight="800" letter-spacing="6"
        fill="url(#gold)" filter="url(#glow)">MEGAZORD</text>
  <text x="640" y="150" text-anchor="middle" font-size="118" font-weight="800" letter-spacing="6"
        fill="none" stroke="#7A5B00" stroke-width="1.2" opacity="0.4">MEGAZORD</text>

  <!-- rayo + CLI tag -->
  <text x="640" y="196" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="10"
        fill="#F5B301">⚡ C L I ⚡</text>

  <!-- tagline -->
  <text x="640" y="238" text-anchor="middle" font-size="24" font-weight="600" fill="#E6EDF3">
    Six AI coding CLIs. One council. They debate, agree, and build.
  </text>
  <text x="640" y="266" text-anchor="middle" font-size="16" fill="#8B949E">
    Runs on the subscriptions you already pay for — not per-token API keys.
  </text>

  <!-- chips de los 4 Zords -->
  <g font-size="15" font-weight="700">
    <g transform="translate(300,318)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#E5484D" opacity="0.16"/>
      <circle cx="20" cy="17" r="6" fill="#E5484D"/>
      <text x="36" y="22" fill="#F5C6C7">Tyranno · Claude</text>
    </g>
    <g transform="translate(468,318)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#9BA3AF" opacity="0.16"/>
      <circle cx="20" cy="17" r="6" fill="#9BA3AF"/>
      <text x="36" y="22" fill="#C9CDD3">Mastodon · Codex</text>
    </g>
    <g transform="translate(636,318)">
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#3B82F6" opacity="0.16"/>
      <circle cx="20" cy="17" r="6" fill="#3B82F6"/>
      <text x="36" y="22" fill="#BBD3FB">Triceratops · Kimi</text>
    </g>
    <g transform="translate(814,318)">
      <rect x="0" y="0" width="176" height="34" rx="17" fill="#A855F7" opacity="0.16"/>
      <circle cx="20" cy="17" r="6" fill="#A855F7"/>
      <text x="36" y="22" fill="#DcC7FA">Pterodactyl · Gemini</text>
    </g>
  </g>
</svg>
